<div class="container-md alert-container">
  @if (alert()) {
    <div
      class="alert alert-dismissible text-center show pag-content-animation"
      role="alert"
      [class]="alert()!.alertClass"
    >
      <i class="me-2" [class]="alert()!.icon"></i>
      {{ alert()!.message }}
      <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
    </div>
  }
</div>
