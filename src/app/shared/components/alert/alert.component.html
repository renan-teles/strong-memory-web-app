<div
  class="container-md"
  style="position: fixed; top: 30px; left: 50%; transform: translateX(-50%); z-index: 10000"
>
  <div class="alert alert-dismissible text-center" role="alert" [ngClass]="componentClass">
    <i class="me-2" [ngClass]="icon"></i>
    {{ message }}
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>
</div>
