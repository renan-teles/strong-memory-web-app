<div>
  <div class="modal-header">
    <h5 class="modal-title">{{ title }}</h5>
    <button class="btn ms-auto" (click)="activeModal.dismiss()" style="border: none">
      <i class="bi-x-circle-fill"></i>
    </button>
  </div>

  <div class="modal-body">
    {{ bodyMessage }}
  </div>

  <div class="modal-footer">
    <button class="btn btn-secondary" (click)="activeModal.dismiss()">Cancelar</button>
    <button class="btn" [class]="btnConfirmClass" (click)="activeModal.close(true)">
      Confirmar
    </button>
  </div>
</div>
