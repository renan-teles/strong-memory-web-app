<div class="col-12 d-block">
  <div
    class="progress"
    role="progressbar"
    aria-valuemin="0"
    aria-valuemax="100"
    [attr.aria-valuenow]="percent()"
  >
    <div
      class="progress-bar progress-bar-striped"
      [style.width]="width()"
      [style.backgroundColor]="color()"
    >
      {{ time() }}s
    </div>
  </div>
</div>
